
<h1>Hello World</h1>
<!-- 

Html Tags are basically the h1 on both sides. Also, the 
left is called opening tag and the right is closing tag.

Everything around the code is called an element including 
the content inside.

Not good practice to have more than one h1.
Don't skip heading levels. You have to go in order.  

-->

<h1>Book</h1>
  <h2>Chapter 1</h2>
    <h3>Section 1</h3>
    <h3>Section 2</h3>
  <h2>Chapter 2</h2>
    <h3>Section 1</h3>
      <h4>Diagram 1</h4>
  <h2>Chapter 3</h2>
    <h3>Section 1</h3>
    <h3>Section 2</h3>
