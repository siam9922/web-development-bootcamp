<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>


<!-- Notes
This is the HTML boiler plate. To start we use an ! and then tab.
This is actually what you start with when you create an HTML file.
<!DOCTYPE html>	Tells the browser to use modern HTML.
<html>	Contains the entire HTML document.
<head>	Contains information about the webpage.
<meta charset="UTF-8">	Supports different characters and symbols.
<title>	Sets the name displayed on the browser tab.
<body>	Contains the visible content of your webpage. -->
